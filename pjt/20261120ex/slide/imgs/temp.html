<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <style>
        .box_red {
            width: 200px; height: 200px;
            background-color: #f00;
            position: static;
        }
    </style>

    <style>
        .box_green {
            width: 200px; height: 200px;
            background-color: #0f0;
            position: relative;
            /* 상대적 위치 */
            top: 50px;
            left: 100px;
        }
    </style>

    
    <style>
        .box_blue {
            width: 200px; height: 200px;
            background-color: #00f;
            position: absolute;
            /* 절대적 위치 */
            top: 50px;
            left: 100px;
        }
    </style>

    <style>
        .box_black {
            width: 200px; height: 200px;
            background-color: #000;
            position: fixed;
            /* 고정 위치 */
            top: 200px;
            left: 500px;
        }
    </style>


</head>
<body>

    <div class="box_red">
        red
    </div>

    <div class="box_green">
